- name: Skip if migration already completed
  ansible.builtin.meta: end_play
  when: lookup('ansible.builtin.file', version_file) is version(migration_version, '>=')

# Nodes provisioned before 1.0.8 do not have the backup package yet.
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
  register: apt_result
  retries: 5
  delay: 10
  until: apt_result is succeeded

- name: Install mosaic-backup package
  ansible.builtin.apt:
    name: mosaic-backup
    state: present

- name: Set version counter to {{ migration_version }}
  ansible.builtin.copy:
    dest: "{{ version_file }}"
    content: "{{ migration_version }}"
    mode: "0644"
